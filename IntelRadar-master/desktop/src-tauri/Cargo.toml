[package]
name = "intelradar"
version = "0.1.0"
description = "IntelRadar — competitor intelligence"
authors = ["IntelRadar"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "intelradar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
rand = "0.8"
tauri = { version = "2.12.4", features = [] }
tauri-plugin-log = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
