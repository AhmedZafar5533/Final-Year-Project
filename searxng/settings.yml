use_default_settings: true
server:
  # Private local instance. Compose exposes it only on host loopback.
  limiter: false
  public_instance: false
  image_proxy: false
search:
  formats:
    - html
    - json
outgoing:
  # The upstream default is 3 seconds, too short for many research/image queries.
  request_timeout: 6.0
  max_request_timeout: 10.0
